name: Task
description: A piece of work to carry out — maintenance, documentation, a one-off task.
type: Task
projects: ["Starfish-Bioscience/6"]
body:
  - type: markdown
    attributes:
      value: "Title: the task and its object in one sentence (e.g. 'Update the installation guide for release 1.2.0')."
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What the task produces and why.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs and versions
      description: Data, parameters, pipeline or package versions, resources needed.
  - type: textarea
    id: command
    attributes:
      label: Command or procedure
      render: shell
  - type: textarea
    id: done
    attributes:
      label: Expected outputs and checks
      description: Where results go and how they are verified.
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: Links
