name: Research / Investigation
description: An exploratory scientific question, with no predefined method or result.
type: Research
projects: ["Starfish-Bioscience/6"]
body:
  - type: markdown
    attributes:
      value: |
        One issue = one significant scientific question, not each hypothesis or experiment.
        Title: the question in one sentence. Everything except the question can be completed later.
  - type: textarea
    id: question
    attributes:
      label: Scientific question
      description: What we want to understand.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and existing knowledge
      description: Why the question arises, what is already known, previous work.
  - type: textarea
    id: leads
    attributes:
      label: Leads
      description: Directions worth exploring, as a plain list. They evolve as the work goes; edit them freely.
      placeholder: |
        - ...
  - type: textarea
    id: conclusions
    attributes:
      label: Conclusions and references
      description: Filled in progressively by editing the issue — findings, decisions, links to reports, data and code.
